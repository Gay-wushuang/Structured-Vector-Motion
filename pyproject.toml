[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-vector-motion"
version = "0.1.0"
description = "Deterministic, non-destructive 2D construction computation model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.390,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
svm = "svm.cli:main"

[tool.setuptools.packages.find]
include = ["svm*"]

[tool.setuptools.data-files]
"share/structured-vector-motion/schema" = ["schema/svm-document-v0.1.schema.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["svm"]
exclude = ["**/__pycache__", ".venv"]
reportMissingTypeStubs = false
