name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,geometry,svg,trace,analysis]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m pyright

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test installed CLI
        run: svm validate examples/001-head-basic.svm.json

      - name: Validate styled showcase
        run: svm validate examples/004-styled-character.svm.json

      - name: Validate SVG import golden
        run: svm validate examples/imported/006-imported-source.svm.json

      - name: Smoke-test Geometry Backend
        run: >
          svm render-svg examples/007-boolean-geometry.svm.json
          --geometry-backend shapely --output boolean-ci.svg
          --view-box 0 0 180 140

      - name: Smoke-test Golden D
        run: >
          svm render-svg examples/008-golden-d.svm.json
          --geometry-backend shapely --output golden-d-ci.svg
          --view-box 0 0 140 115

      - name: Smoke-test Golden E
        run: >
          svm render-svg examples/imported/009-bitmap-trace.svm.json
          --geometry-backend shapely --output golden-e-ci.svg
          --view-box 0 0 96 80

      - name: Smoke-test Golden F
        run: >
          svm render-svg examples/imported/010-structured-trace.svm.json
          --geometry-backend shapely --output golden-f-ci.svg
          --view-box 0 0 120 90

      - name: Smoke-test Golden G
        run: >
          svm render-svg examples/imported/011-reconciled-trace.svm.json
          --geometry-backend shapely --output golden-g-ci.svg
          --view-box 0 0 120 90

      - name: Validate Golden H
        run: svm validate examples/imported/012-opencv-analysis.svm.json

      - name: Smoke-test OpenCV Analysis
        run: >
          svm analyze-bitmap examples/005-empty-canvas.svm.json
          examples/assets/006-opencv-analysis-source.png --threshold 128

      - name: Validate Golden I
        run: svm validate examples/imported/013-component-promotion.svm.json

      - name: Smoke-test Component Promotion
        run: >
          svm promote-components examples/imported/012-opencv-analysis.svm.json
          examples/derived/012-opencv-analysis/component-analysis.json
          --candidate candidate:component-0001
          --candidate candidate:component-0002

      - name: Validate Golden J
        run: svm validate examples/imported/015-structural-relations.svm.json

      - name: Smoke-test Structural Relations preview
        run: >
          svm promote-components examples/imported/014-contained-analysis.svm.json
          examples/derived/014-contained-analysis/component-analysis.json
          --candidate candidate:component-0001
          --candidate candidate:component-0002
